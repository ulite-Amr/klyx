name: CI Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/test-lsp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"
  APP_NAME: "Klyx"
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout submodules
        run: git submodule update --init --recursive --depth 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          yes | sdkmanager "ndk;29.0.14206865"

      - name: Install CMake
        run: |
          CMAKE_VERSION=4.3.2
          wget -q https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
          tar -xzf cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
          echo "cmake.dir=$PWD/cmake-${CMAKE_VERSION}-linux-x86_64" >> local.properties
          echo "$PWD/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> $GITHUB_PATH
          "$PWD/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake" --version

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Prepare TreeSitter bindings
        run: ./gradlew prepareTreeSitter

      - name: Decode CI signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KLYX_CI_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KLYX_CI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KLYX_CI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KLYX_CI_KEY_PASSWORD }}
        run: |
          # The signing key MUST stay identical across every run: the APK
          # signature changes whenever the key changes, so installing a new build
          # over the previous one fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE,
          # forcing a full uninstall that wipes the on-device rootfs (toolchains,
          # language servers, ...). The keystore is therefore stored as a base64
          # repo secret (KLYX_CI_KEYSTORE_B64), never regenerated per run. Fail
          # hard when a secret is missing rather than falling back to a fresh key.
          test -n "$KEYSTORE_B64" || { echo "::error::missing repo secret KLYX_CI_KEYSTORE_B64 - set it in Settings > Secrets and variables > Actions"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::missing repo secret KLYX_CI_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::missing repo secret KLYX_CI_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::missing repo secret KLYX_CI_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > /tmp/klyx.keystore
          test -s /tmp/klyx.keystore || { echo "::error::decoded KLYX_CI_KEYSTORE_B64 is empty - secret is corrupt"; exit 1; }
          printf 'keyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD" > /tmp/sign.properties
          keytool -list -keystore /tmp/klyx.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1 || { echo "::error::keystore/alias/password mismatch - regenerate or re-set the secrets"; exit 1; }

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: klyx-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 15
          if-no-files-found: error