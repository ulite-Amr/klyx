name: CI Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/test-lsp
      - fix/lsp-diagnostics

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"
  APP_NAME: "Klyx"
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout submodules
        run: git submodule update --init --recursive --depth 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          yes | sdkmanager "ndk;29.0.14206865"

      - name: Install CMake
        run: |
          CMAKE_VERSION=4.3.2
          wget -q https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
          tar -xzf cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
          echo "cmake.dir=$PWD/cmake-${CMAKE_VERSION}-linux-x86_64" >> local.properties
          echo "$PWD/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> $GITHUB_PATH
          "$PWD/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake" --version

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Prepare TreeSitter bindings
        run: ./gradlew prepareTreeSitter

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/klyx.keystore \
            -storepass klyxci123 \
            -alias klyx \
            -keypass klyxci123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Klyx CI, O=Klyx, C=US"
          printf 'keyAlias=klyx\nkeyPassword=klyxci123\nstorePassword=klyxci123\n' > /tmp/sign.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: klyx-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 15
          if-no-files-found: error